[package]
name = "lp_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["gage-marshall"]
description = "LovePlus+ on a native engine, run from the player's own game file"

[features]
# the release's translation and notices built into the program (a portable single-file program):
# dist/translation-en.lpdelta and dist/THIRD_PARTY_NOTICES.txt must exist when it is built
embedded = []

[lib]
name = "lp_engine"
path = "src/lib.rs"

[[bin]]
name = "script_trace"
path = "src/bin/script_trace.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.15"
flate2 = "1"
gilrs = "0.10"
rfd = "0.14"
muda = "0.21.2"
png = "0.18.1"
pollster = "1.0.1"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde_json = "1.0.154"
sha1 = "0.11.0"
wgpu = "22"
winit = "0.30"

[build-dependencies]
# the program's icon and version information on Windows (build.rs)
winresource = "0.1"

[[bin]]
name = "nns2d_dump"
path = "src/bin/nns2d_dump.rs"

[[bin]]
name = "text_dump"
path = "src/bin/text_dump.rs"

[[bin]]
name = "loader_sample"
path = "src/bin/loader_sample.rs"

[[bin]]
name = "nns3d_dump"
path = "src/bin/nns3d_dump.rs"

[[bin]]
name = "heroine_dump"
path = "src/bin/heroine_dump.rs"

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"

[[bin]]
name = "machine_dump"
path = "src/bin/machine_dump.rs"

[[bin]]
name = "host_run"
path = "src/bin/host_run.rs"

[[bin]]
name = "host_survey"
path = "src/bin/host_survey.rs"

[[bin]]
name = "sdat_dump"
path = "src/bin/sdat_dump.rs"

[[bin]]
name = "siren_dump"
path = "src/bin/siren_dump.rs"

[[bin]]
name = "audio_render"
path = "src/bin/audio_render.rs"

[[bin]]
name = "scene_audio"
path = "src/bin/scene_audio.rs"

[[bin]]
name = "note_dump"
path = "src/bin/note_dump.rs"

[[bin]]
name = "font_dump"
path = "src/bin/font_dump.rs"

[[bin]]
name = "scene_player"
path = "src/bin/scene_player.rs"

[[bin]]
name = "scene_replay"
path = "src/bin/scene_replay.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "apply_patch"
path = "src/bin/apply_patch.rs"
