[package]
name = "lp_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "lp_engine"
path = "src/lib.rs"

[[bin]]
name = "script_trace"
path = "src/bin/script_trace.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.15"
png = "0.18.1"
pollster = "1.0.1"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde_json = "1.0.154"
sha1 = "0.11.0"
wgpu = "22"
winit = "0.30"

[[bin]]
name = "nns2d_dump"
